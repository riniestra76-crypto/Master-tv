<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER TV CHECKER V6 - REAL TEST</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:10px}
h1{background:linear-gradient(90deg,#00ff88,#008cff);color:#000;padding:12px;border-radius:8px;text-align:center;font-size:16px}
.card{background:#1a1a1a;border-radius:10px;padding:12px;margin:10px 0;border-left:5px solid #00ff88}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#222;color:#fff;margin:5px 0}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:8px}
.btn-o{background:linear-gradient(90deg,#ff7b00,#ffaa00);color:#000}
.btn-g{background:#00ff88;color:#000}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:#222;color:#00ff88;padding:8px;text-align:left}
td{padding:8px;border-bottom:1px solid #222}
.log{background:#000;padding:10px;border-radius:6px;height:150px;overflow:auto;font-size:11px;border:1px solid #333;color:#aaa}
.b{padding:4px 6px;border-radius:4px;font-size:10px;font-weight:900}
.b-ok{background:#00ff88;color:#000}
.b-bad{background:#ff4444;color:#fff}
.b-test{background:#ffaa00;color:#000}
</style>
</head>
<body>
<h1>🔍 CHECKER V6 REAL - TEST LIVE / DEAD</h1>
<div class="card">
<input id="url" value="https://raw.githubusercontent.com/riniestra76-crypto/Master-tv/main/latinos.m3u">
<button class="btn btn-o" onclick="cargarURL()">📥 CARGAR DESDE URL</button>
<input type="file" id="file" accept=".m3u,.m3u8,.txt">
</div>
<div class="card" id="stats" style="display:none">
<div style="display:flex;gap:8px;text-align:center">
<div style="flex:1;background:#111;padding:10px;border-radius:8px"><div id="t" style="font-size:22px;font-weight:900">0</div><div style="font-size:10px;color:#888">TOTAL</div></div>
<div style="flex:1;background:#111;padding:10px;border-radius:8px"><div id="l" style="font-size:22px;color:#00ff88;font-weight:900">0</div><div style="font-size:10px;color:#888">LIVE</div></div>
<div style="flex:1;background:#111;padding:10px;border-radius:8px"><div id="d" style="font-size:22px;color:#ff4444;font-weight:900">0</div><div style="font-size:10px;color:#888">DEAD</div></div>
</div>
<div class="log" id="log"></div>
<button class="btn btn-g" id="btnCopy" style="display:none" onclick="copiarLive()">📋 COPIAR SOLO LIVE</button>
</div>
<div class="card"><table id="tabla"><tr><th>#</th><th>Canal</th><th>Estado</th></tr></table></div>
<script>
let canales=[],liveArr=[],stopTest=false;
let proxies=['https://api.allorigins.win/raw?url=','https://corsproxy.io/?','https://api.codetabs.com/v1/proxy?quest='];
function log(m){let el=document.getElementById('log');el.innerHTML+=m+'<br>';el.scrollTop=el.scrollHeight;}
function parseM3U(text){
  canales=[];liveArr=[];
  document.getElementById('tabla').innerHTML='<tr><th>#</th><th>Canal</th><th>Estado</th></tr>';
  let lines=text.split(/\r?\n/);let cur='';let id=0;
  lines.forEach(line=>{line=line.trim();if(line.startsWith('#EXTINF')){let p=line.split(',');cur=p[p.length-1].trim();}else if(line.startsWith('http')){id++;canales.push({id:id,name:cur,url:line});cur='';}});
  document.getElementById('stats').style.display='block';document.getElementById('t').innerText=canales.length;log(canales.length+' canales encontrados');render();testAll();
}
function render(){let tb=document.getElementById('tabla');tb.innerHTML='<tr><th>#</th><th>Canal</th><th>Estado</th></tr>';canales.forEach(c=>{let tr=document.createElement('tr');tr.innerHTML=`<td>${c.id}</td><td>${c.name.substring(0,30)}</td><td id="s-${c.id}"><span class="b" style="background:#333">ESPERA</span></td>`;tb.appendChild(tr);});}
async function fetchWithProxy(url){for(let proxy of proxies){try{let full=proxy+encodeURIComponent(url);let ctrl=new AbortController();setTimeout(()=>ctrl.abort(),7000);let res=await fetch(full,{signal:ctrl.signal});if(!res.ok)continue;let txt=await res.text();if(txt.length>50)return txt;}catch(e){continue;}}return null;}
async function testOne(c){document.getElementById('s-'+c.id).innerHTML='<span class="b b-test">TESTING</span>';let txt=await fetchWithProxy(c.url);if(txt&&(txt.includes('#EXTM3U')||txt.includes('#EXT-X')||txt.length>200))return 'live';return 'dead';}
async function testAll(){let live=0,dead=0;for(let i=0;i<canales.length;i++){if(stopTest)break;let c=canales[i];log(`[${c.id}/${canales.length}] ${c.name}`);let res=await testOne(c);if(res=='live'){live++;liveArr.push(c);document.getElementById('s-'+c.id).innerHTML='<span class="b b-ok">LIVE ✅</span>';log(`✅ LIVE: ${c.name}`);}else{dead++;document.getElementById('s-'+c.id).innerHTML='<span class="b b-bad">DEAD ❌</span>';log(`❌ DEAD: ${c.name}`);}document.getElementById('l').innerText=live;document.getElementById('d').innerText=dead;await new Promise(r=>setTimeout(r,400));}log(`FINAL ${live} LIVE / ${dead} DEAD`);if(liveArr.length>0)document.getElementById('btnCopy').style.display='block';}
async function cargarURL(){let u=document.getElementById('url').value.trim();let txt=await fetchWithProxy(u);if(!txt){try{let r=await fetch(u);txt=await r.text();}catch(e){alert('Sube archivo.m3u');return;}}parseM3U(txt);}
document.getElementById('file').addEventListener('change',e=>{let f=e.target.files[0];let rd=new FileReader();rd.onload=ev=>parseM3U(ev.target.result);rd.readAsText(f);});
function copiarLive(){let m3u='#EXTM3U\n';liveArr.forEach(c=>{m3u+=`#EXTINF:-1,${c.name}\n${c.url}\n\n`;});navigator.clipboard.writeText(m3u);alert(`${liveArr.length} LIVE copiados`);}
</script>
</body>
</html>
